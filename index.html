<style>
/* ───────────────────────────────────────────────────────────────────
   La estructura de links.cadcc.cl (LinkStack, tema galaxy) con la
   identidad de JOIN: avatar circular, nombre, bio, fila de redes y una
   pila de botones con separadores de sección.

   Lo que cambia respecto del CaDCC: el fondo es el tono `tinta` de
   social/join-social.typ en vez del azul galaxia, las estrellas son
   bowties del logo, y toda la página va en Inconsolata, la misma
   monoespaciada de la palabra JOIN en las guías.

   Tema único: el fondo oscuro se ve igual venga el teléfono en claro
   o en oscuro.
   ─────────────────────────────────────────────────────────────────── */
:root{
  --tinta:#1C1B19;        /* el fondo */
  --tinta-alta:#26241F;
  --crema:#F1EDE6;
  --azul:#0366D6;         /* el azul del logo */
  --azul-claro:#79B8FF;   /* el azul que sí se lee sobre tinta */
  --blanco:#FFFFFF;

  --texto-suave:rgba(241,237,230,.76);
  --borde:rgba(241,237,230,.22);
  --borde-vivo:rgba(121,184,255,.55);
  --lavado:rgba(121,184,255,.10);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  min-height:100vh;
  background:var(--tinta);
  color:var(--crema);
  font-family:Inconsolata,ui-monospace,"SF Mono",Menlo,monospace;
  font-size:17px;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── el cielo de bowties ──────────────────────────────────────────── */
/* La versión JOIN del fondo de estrellas del tema galaxy: el símbolo del
   natural join a distintos tamaños, derivando muy despacio. */
.cielo{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cielo svg{position:absolute;fill:var(--azul-claro);animation:deriva linear infinite alternate}
@keyframes deriva{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(var(--dx),var(--dy),0)}
}

.hoja{
  position:relative;
  z-index:1;
  width:100%;
  max-width:27rem;
  margin:0 auto;
  padding:3.25rem 1.35rem 3rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* ── avatar, nombre, bio ──────────────────────────────────────────── */
/* El ícono del avatar de Instagram en negativo: disco azul y bowtie blanco,
   con el aire alrededor que pide `instrucciones-forms-y-logo.txt` para que
   el símbolo aguante el recorte circular. Sin anillo: el disco azul ya se
   despega del fondo tinta, y cualquier halo sobre ese fondo se ensucia. */
.avatar{
  width:7.25rem;
  height:7.25rem;
  border-radius:50%;
  background:var(--azul);
  display:grid;
  place-items:center;
}
.avatar svg{width:52%;height:auto;fill:var(--blanco)}

.nombre{
  margin:1.35rem 0 0;
  font-weight:700;
  font-size:2.7rem;
  line-height:1;
  letter-spacing:.14em;
  padding-left:.14em;      /* la N arrastra el tracking; se compensa */
  color:var(--crema);
}

.bio{
  margin:.95rem 0 0;
  max-width:34ch;
  font-size:.92rem;
  line-height:1.65;
  color:var(--texto-suave);
  text-wrap:balance;
}

/* ── fila de redes ────────────────────────────────────────────────── */
.redes{display:flex;gap:1.5rem;margin-top:1.5rem}
.redes a{
  display:grid;place-items:center;
  width:2.4rem;height:2.4rem;
  color:var(--crema);
  border-radius:50%;
  transition:color .15s ease,transform .15s ease;
}
.redes svg{width:1.5rem;height:1.5rem}
.redes a:hover,.redes a:focus-visible{color:var(--azul-claro);transform:translateY(-2px)}

/* ── próximas sesiones ────────────────────────────────────────────── */
/* No es un botón, aunque antes lo parecía: es la única zona de contenido
   de la página. Por eso deja la caja redondeada y pasa a leerse como la
   agenda de una guía, alineada a la izquierda y sobre la regla gruesa de
   join.sty. El número grande es el recurso `cifra` de join-social.typ:
   "para que el número mande". Al ir todo en monoespaciada, las columnas
   calzan solas. */
.sesiones{width:100%;margin-top:2.2rem;text-align:left}
.sesiones h2{
  margin:0;
  font-size:.95rem;
  font-weight:700;
  color:var(--crema);
}
.sesiones hr{
  height:2px;
  margin:.55rem 0 0;
  background:var(--azul);
  border:0;
}
.sesiones ol{list-style:none;margin:0;padding:0}
.sesiones li{border-bottom:1px solid var(--borde)}

/* Cada sesión lleva a su propio formulario. El margen negativo hace que el
   lavado del hover respire a los lados sin desalinear el contenido. */
.sesion{
  display:grid;
  grid-template-columns:3.5rem 1fr auto;
  align-items:center;
  margin-inline:-.6rem;
  padding:.95rem .6rem;
  border-radius:8px;
  color:inherit;
  text-decoration:none;
  transition:background-color .15s ease;
}
a.sesion:hover,a.sesion:focus-visible{background:var(--lavado)}
a.sesion:focus-visible{outline:2px solid var(--azul-claro);outline-offset:0}

/* La columna de la fecha, separada por el mismo filete que la franja de
   etiquetas al margen de las guías. */
.sesion-fecha{
  padding-right:1rem;
  border-right:1px solid var(--borde);
  text-align:center;
  align-self:stretch;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.sesion-dia{
  font-size:1.85rem;
  font-weight:700;
  line-height:1;
  color:var(--azul-claro);
  font-variant-numeric:tabular-nums;
}
.sesion-mes{
  margin-top:.2rem;
  font-size:.7rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--texto-suave);
}

.sesion-detalle{padding-left:1.1rem;min-width:0}
.sesion-codigo{
  display:block;
  font-size:.71rem;
  font-weight:700;
  letter-spacing:.13em;
  color:var(--azul-claro);
}
.sesion-ramo{
  display:block;
  margin-top:.1rem;
  font-size:1rem;
  font-weight:700;
  line-height:1.25;
  color:var(--crema);
}
.sesion-cuando{
  display:block;
  margin-top:.25rem;
  font-size:.85rem;
  line-height:1.4;
  color:var(--texto-suave);
}
.sesion-accion{
  display:inline-block;
  margin-top:.5rem;
  font-size:.8rem;
  font-weight:700;
  color:var(--azul-claro);
  border-bottom:1px solid rgba(121,184,255,.45);
  transition:border-color .15s ease;
}
a.sesion:hover .sesion-accion,a.sesion:focus-visible .sesion-accion{border-bottom-color:currentColor}

/* La manito a la derecha: en celular no hay hover, así que es la pista de
   que la fila entera se toca. Sube y baja apenas, como dando el toque. */
.sesion-mano{
  flex:none;
  width:1.5rem;
  height:1.5rem;
  margin-left:.8rem;
  color:var(--azul-claro);
  opacity:.75;
  animation:toque 2.4s ease-in-out infinite;
}
a.sesion:hover .sesion-mano,a.sesion:focus-visible .sesion-mano{opacity:1}
@keyframes toque{
  0%,70%,100%{transform:translateY(0)}
  80%{transform:translateY(2px)}
}

/* ── botones ──────────────────────────────────────────────────────── */
.botones{
  width:100%;
  margin-top:2rem;
  display:flex;
  flex-direction:column;
  gap:.7rem;
}

.boton{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.65rem;
  min-height:3.4rem;
  padding:.85rem 1.1rem;
  border:1px solid var(--borde);
  border-radius:12px;
  text-decoration:none;
  color:var(--crema);
  background:transparent;
  font-weight:500;
  font-size:1rem;
  line-height:1.25;
  transition:border-color .16s ease,background-color .16s ease,transform .16s ease;
  /* Entran escalonados, como los del CaDCC, pero corto: a los 0,7 s ya
     está todo quieto y visible. */
  animation:entrada .35s ease both;
  animation-delay:var(--retardo,0s);
}
.boton svg{flex:none;width:1.15rem;height:1.15rem}
.boton:hover,.boton:focus-visible{
  border-color:var(--borde-vivo);
  background:var(--lavado);
  transform:translateY(-2px);
}
.boton:active{transform:translateY(0)}

/* El único relleno: la inscripción. */
.boton.principal{
  background:var(--azul);
  border-color:var(--azul);
  color:var(--blanco);
  font-weight:700;
}
.boton.principal:hover,.boton.principal:focus-visible{
  background:#1478E8;
  border-color:#1478E8;
}

.boton:focus-visible,.redes a:focus-visible,.pie a:focus-visible{
  outline:2px solid var(--azul-claro);
  outline-offset:3px;
}

@keyframes entrada{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── separador de sección ─────────────────────────────────────────── */
.seccion{
  width:100%;
  margin:1.6rem 0 .2rem;
  display:flex;
  align-items:center;
  gap:.85rem;
  font-weight:700;
  font-size:.76rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--azul-claro);
}
.seccion::before,.seccion::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--borde);
}

/* ── pie ──────────────────────────────────────────────────────────── */
.pie{
  margin-top:2.75rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1rem;
  font-size:.8rem;
  line-height:1.7;
  color:rgba(241,237,230,.6);
}
.pie p{margin:0}
.pie p a{color:var(--crema);text-decoration:none;border-bottom:1px solid var(--borde)}
.pie p a:hover,.pie p a:focus-visible{border-bottom-color:var(--azul-claro);color:var(--azul-claro)}

/* Los logos del CaDCC y del DCC están dibujados para fondo claro: sobre la
   tinta el morado y el gris no se leen. Van dentro de una placa crema con
   las esquinas redondeadas, que respeta los colores oficiales sin tener
   que recolorear la marca de nadie. */
.placa{
  display:flex;
  align-items:center;
  gap:1.15rem;
  padding:.85rem 1.2rem;
  background:var(--crema);
  border-radius:14px;
}
.placa a{display:block;border-radius:6px;transition:opacity .15s ease}
.placa a:hover,.placa a:focus-visible{opacity:.65}
.placa img{display:block;width:auto}
.placa .logo-cadcc{height:46px}
.placa .logo-dcc{height:40px}
/* El filete que separa las dos marcas, en la tinta rebajada de la placa. */
.placa .filete{width:1px;align-self:stretch;background:rgba(28,27,25,.18)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .boton{opacity:1}
}
</style>
</head>

function icono(nombre) {
  const d = ICONOS[nombre];
  if (!d) return null;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.6");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = d;
  return svg;
}

function hijo(tag, cls, txt) {
  const n = document.createElement(tag);
  n.className = cls;
  n.textContent = txt;
  return n;
}

function abrir(a, url) {
  a.href = url;
  a.rel = "noopener";
  if (/^https?:/i.test(url)) a.target = "_blank";
}

function pintarCabecera() {
  document.querySelector("#bio-slot").textContent = BIO;

  const redes = document.querySelector("#redes-slot");
  for (const red of REDES) {
    const a = document.createElement("a");
    abrir(a, red.url);
    a.title = red.nombre;
    a.setAttribute("aria-label", red.nombre);
    const svg = icono(red.icono);
    if (svg) a.append(svg);
    redes.append(a);
  }

}

function pintarSesiones() {
  const slot = document.querySelector("#sesiones-slot");
  if (!SESIONES || SESIONES.length === 0) { slot.remove(); return; }

  const caja = document.createElement("section");
  caja.className = "sesiones";

  const titulo = document.createElement("h2");
  titulo.textContent = "Próximas sesiones";
  caja.append(titulo, document.createElement("hr"));

  const lista = document.createElement("ol");
  for (const sesion of SESIONES) {
    const item = document.createElement("li");

    // Con `url` la fila es un enlace; sin ella, un bloque que solo informa.
    const fila = document.createElement(sesion.url ? "a" : "div");
    fila.className = "sesion";
    if (sesion.url) abrir(fila, sesion.url);

    const fecha = document.createElement("div");
    fecha.className = "sesion-fecha";
    fecha.append(
      // A dos dígitos, como la `cifra` de las guías: así la columna mide
      // siempre lo mismo, venga un 7 o un 16.
      hijo("span", "sesion-dia", String(sesion.dia).padStart(2, "0")),
      hijo("span", "sesion-mes", sesion.mes),
    );

    const detalle = document.createElement("div");
    detalle.className = "sesion-detalle";
    if (sesion.codigo) detalle.append(hijo("span", "sesion-codigo", sesion.codigo));
    detalle.append(hijo("span", "sesion-ramo", sesion.ramo));

    const cuando = [sesion.diaSemana, sesion.hora, sesion.lugar].filter(Boolean).join(", ");
    if (cuando) detalle.append(hijo("span", "sesion-cuando", cuando));

    if (sesion.url) {
      detalle.append(hijo("span", "sesion-accion", "Inscribirse"));
    }

    fila.append(fecha, detalle);
    if (sesion.url) {
      const mano = icono("tocar");
      mano.classList.add("sesion-mano");
      fila.append(mano);
    }
    item.append(fila);
    lista.append(item);
  }

  caja.append(lista);
  slot.replaceWith(caja);
}

function pintarBotones() {
  const cont = document.querySelector("#botones-slot");
  const frag = document.createDocumentFragment();
  let n = 0;

  for (const item of BOTONES) {
    if (item.seccion) {
      const h = document.createElement("h2");
      h.className = "seccion";
      h.textContent = item.seccion;
      frag.append(h);
      continue;
    }

    const a = document.createElement("a");
    a.className = item.principal ? "boton principal" : "boton";
    a.style.setProperty("--retardo", (n * 0.06).toFixed(2) + "s");
    abrir(a, item.url);

    const svg = icono(item.icono);
    if (svg) a.append(svg);
    a.append(document.createTextNode(item.titulo));

    frag.append(a);
    n++;
  }

  cont.append(frag);
}
